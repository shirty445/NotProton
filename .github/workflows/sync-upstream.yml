name: sync upstream

# NotProtonGPTK: merges NotProtonNot/NotProton into this fork every day. A clean merge is
# pushed and the app workflow is started on it; a conflicting one opens an issue instead,
# to be finished locally with scripts/sync-upstream.sh.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

env:
  UPSTREAM: https://github.com/NotProtonNot/NotProton.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream "$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream."
            echo "result=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            git push origin HEAD
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the merged tree
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run app.yml --ref "${{ github.ref_name }}"

      - name: Report a conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream sync needs a hand: $(git rev-parse --short "upstream/$UPSTREAM_BRANCH")"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' | grep -q .; then
            exit 0
          fi
          {
            echo "Merging upstream \`$UPSTREAM_BRANCH\` conflicts in:"
            echo
            sed 's/^/- `/; s/$/`/' conflicts.txt
            echo
            echo "Finish it locally with \`scripts/sync-upstream.sh\`. FORK.md lists the few upstream files this fork touches."
          } > body.md
          gh issue create --title "$title" --body-file body.md
